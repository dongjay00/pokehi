[package]
name = "pokehi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "새 터미널을 열 때마다 포켓몬 한 마리가 인사하는 CLI"
license = "MIT"
repository = "https://github.com/dongjay00/pokehi"
readme = "README.md"
keywords = ["pokemon", "terminal", "greeting", "cli", "pokeapi"]
categories = ["command-line-utilities"]
exclude = ["docs/", ".superpowers/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
png = "0.17"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2"
unicode-width = "0.2"
terminal_size = "0.4"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
